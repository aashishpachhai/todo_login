{% extends 'base.html' %} {% block start %}

<div style="display: flex; align-items: center; justify-content: center; margin: 1rem;">
 
    <form action="" method="POST" style="background-color: black; padding: 2rem; width: 40%; border-radius: 16px;">
        {% csrf_token %}
        <h2>Create Todo</h2>
      <div style="display: flex; flex-direction: column; gap: 0.5rem;margin: 0.5rem;">
        <label for="">Task</label>
        <input type="text" name="title"   style="padding: 0.8rem; outline: none; border: none; color: black" />
      </div>
      <div style="display: flex; flex-direction: column;gap: 0.5rem; margin: 0.5rem;">
         <label for="">Description</label>
          <textarea name="description"   style="padding: 0.8rem; outline: none; border: none; color: black"></textarea>
        </label>
      </div>
      <button  style="
        background-color: green;
        color: white;
        border: none;
        padding: 1rem;
        border-radius: 0.2rem;
        width: 100%;
        cursor: pointer;
        margin-top: 1rem;
      " >Create</button>
    </form>

</div>
<div style="align-items: center;justify-content: center; display: flex;">
    <table border="1px solid black " style="width: 80%;">
        <tr style="color: black;">
            <th style="color: black; " >Task</th>
            <th style="color: black;">Description</th>
            <th style="color: black;">Actions</th>
        </tr>
        {% for task in todos %}
        <tr>
            <td style="color: black; text-align: center;">{{task.title}}</td>
            <td style="color: black; text-align: center;">{{task.description}}</td>
            <td style="color: black; text-align: center;">
                <div style="display: flex; gap:0.25rem">
                    <button  style="
        background-color: green;
        color: white;
        border: none;
        padding: 0.5rem;
        border-radius: 0.2rem;
        width: 100%;
        cursor: pointer;
      " ><a href="/edit/{{task.id}}" style="text-decoration: none;">Edit</a></button>
        <button style="
        background-color: red;
        color: white;
        border: none;
        padding: 0.5rem;
        border-radius: 0.2rem;
        width: 100%;
        cursor: pointer;
       ">
       <a href="/delete/{{task.id}}" style="text-decoration: none;">Delete</a></button></button>
                </div></td>
            </tr>   
            {% endfor %}
    </table>
</div>

{% endblock %}
